<!DOCTYPE html>
<html>
    <head>
        <title>@ciceroyce</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <style>
            body { 
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
                text-align: center; 
                margin: 0;
                padding: 20px;
                color: #333;
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                position: relative;
                overflow: hidden;
            }
            /* Fixed background video styling for perfect mobile coverage */
            .bg-video {
                position: absolute;
                top: 50%;
                left: 50%;
                width: 100%;
                height: 100%;
                object-fit: cover;
                transform: translate(-50%, -50%);
                z-index: -2;
            }
            .video-overlay {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.5);
                z-index: -1;
            }
            .container {
                max-width: 400px;
                width: 90%;
                background: rgba(255, 255, 255, 0.95);
                padding: 30px 20px;
                border-radius: 15px;
                box-shadow: 0 10px 25px rgba(0,0,0,0.3);
                box-sizing: border-box;
                z-index: 1;
            }
            h1 { 
                color: #2c3e50; 
                margin-bottom: 10px; 
                font-size: 1.5rem; 
            }
            p { 
                color: #7f8c8d; 
                font-size: 0.95rem; 
            }
            .btn-container {
                margin-top: 25px;
                display: flex;
                flex-direction: column;
                gap: 12px;
            }
            .btn {
                display: block;
                width: 100%;
                padding: 12px 0;
                border-radius: 8px;
                text-decoration: none;
                font-weight: bold;
                font-size: 0.95rem;
                box-sizing: border-box;
                transition: transform 0.2s, opacity 0.2s;
            }
            .btn:hover {
                transform: translateY(-2px);
                opacity: 0.9;
            }
            .whatsapp { background-color: #25D366; color: white; }
            .discord { background-color: #5865F2; color: white; }
            .instagram { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); color: white; }
        </style>
    </head>
    <body>
        <!-- Background Video and Dark Overlay -->
        <video autoplay muted loop playsinline class="bg-video">
            <source src="wwww.mp4" type="video/mp4">
            Your browser does not support HTML5 video.
        </video>
        <div class="video-overlay"></div>

        <div class="container">
            <h1>Hello!!, Contact ME at : 🚀</h1>
            <p>Feel free to contact Me!!</p>
            
            <div class="btn-container">
                <a class="btn whatsapp" href="https://wa.me/6285102148965" target="_blank">📱 WhatsApp: 085102148965</a>
                <a class="btn discord" href="https://discord.gg/jCBBnMnTv" target="_blank">🎮 Join my Discord Server</a>
                <a class="btn instagram" href="https://instagram.com/ciceroyce" target="_blank">📸 Instagram: @ciceroyce</a>
            </div>
        </div>
    </body>
</html>
